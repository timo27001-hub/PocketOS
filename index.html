{height:calc(100% - 61px);min-height:0;display:flex;gap:8px;align-items:center;justify-content:center}.sim-wrap canvas{height:100%;max-width:79%;aspect-ratio:16/9;object-fit:contain;border-radius:8px;touch-action:none}.sim-controls{display:grid;grid-template-columns:repeat(2,50px);gap:6px}.sim-controls button{border:0;border-radius:9px;background:#dce8ff;color:#19365d;font-weight:800;min-height:46px;touch-action:none;user-select:none;font-size:12px}@media(max-height:390px){.sim-controls button{min-height:36px}} </style></head><body data-theme="ocean"><div id="desktop-shell"><header><span>◆ PocketOS</span><span id="appname">Desktop</span><span class="right status" id="net">Offline ready</span><span id="clock"></span></header><main><div class="desktop-icon"><button onclick="openApp('Files')">📁</button><small>Files</small></div><section class="window" id="window"><div class="titlebar" id="drag"><button class="close" onclick="closeWin()" aria-label="Zavrieť"></button><b id="winTitle">Files</b><span style="margin-left:auto;font-size:10px">PocketOS 0.9</span></div><div class="content" id="content"></div></section><nav class="dock"><button class="app" title="Files" onclick="openApp('Files')">📁</button><button class="app" title="Gallery" onclick="openApp('Gallery')">🗂️</button><button class="app" title="Notes" onclick="openApp('Notes')">📝</button><button class="app" title="Photos" onclick="openApp('Photos')">🖼️</button><button class="app" title="Terminal" onclick="openApp('Terminal')">⌨️</button><button class="app" title="Games" onclick="openApp('Games')">🎮</button><button class="app" title="Settings" onclick="openApp('Settings')">⚙️</button></nav></main></div><script>
const w=document.getElementById('window'),c=document.getElementById('content');let photoURL=null,photoImg=null,photoRotation=0,photoFlip=false;function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);function net(){document.getElementById('net').textContent=navigator.onLine?'● Online':'● Offline'}addEventListener('online',net);addEventListener('offline',net);net();function closeWin(){stopGame();w.classList.remove('active');document.getElementById('appname').textContent='Desktop'}function openApp(n){stopGame();document.getElementById('winTitle').textContent=n;document.getElementById('appname').textContent=n;w.classList.add('active');w.style.left='9%';w.style.top='5%';if(n==='Games'){showGames()}if(n==='Notes'){c.innerHTML='<textarea id="notes" placeholder="Tvoje poznámky sa ukladajú do tohto iPhonu..."></textarea>';let x=document.getElementById('notes');x.value=localStorage.getItem('pocketos-notes')||'';x.oninput=()=>localStorage.setItem('pocketos-notes',x.value)}if(n==='Files'){c.innerHTML='<b>Moje súbory</b><p class="hint">Vyber súbor z aplikácie Súbory. PocketOS nemá automatický prístup ku všetkým súborom iOS.</p><input id="fileInput" type="file" multiple><div id="fileList"></div>';document.getElementById('fileInput').onchange=e=>{let list=document.getElementById('fileList');list.replaceChildren();for(const f of e.target.files){let row=document.createElement('div');row.className='file-row';let name=document.createElement('span');name.textContent='📄 '+f.name+' ('+Math.round(f.size/1024)+' KB)';let b=document.createElement('button');b.className='action secondary';b.textContent='Otvoriť';b.onclick=()=>{if(f.type.startsWith('image/')){openApp('Photos');loadPhoto(f)}else if(f.type.startsWith('text/')){f.text().then(t=>{openApp('Notes');document.getElementById('notes').value=t})}else alert('Tento typ súboru PocketOS zatiaľ nevie zobraziť.')};row.append(name,b);list.append(row)}}}if(n==='Gallery'){c.innerHTML='<b>Offline galéria</b><p class="hint">Fotky sa ukladajú iba do tohto iPhonu. iOS ich môže pri nedostatku miesta odstrániť – dôležité fotky si zálohuj.</p><input type="file" id="galleryInput" accept="image/*" multiple><div id="galleryList" class="gallery-grid"></div>';document.getElementById('galleryInput').onchange=async e=>{for(const file of e.target.files){try{await galleryPut(file)}catch(err){alert('Fotku sa nepodarilo uložiť: '+err.message)}}renderGallery()};renderGallery()}if(n==='Photos'){c.innerHTML='<div class="photo-layout"><div class="photo-stage"><canvas id="canvas" width="640" height="360"></canvas></div><div class="photo-tools"><label><b>Photo Editor</b></label><input type="file" id="photoInput" accept="image/*"><label>Jas <output id="brightVal">100%</output><input id="bright" type="range" min="0" max="200" value="100"></label><label>Kontrast <output id="contrastVal">100%</output><input id="contrast" type="range" min="0" max="200" value="100"></label><label>Sýtosť <output id="satVal">100%</output><input id="sat" type="range" min="0" max="200" value="100"></label><button class="action" id="savePhoto">Export JPG</button><button class="action secondary" id="keepPhoto">Uložiť do galérie</button><button class="action secondary" id="rotatePhoto">↻ Otočiť</button><button class="action secondary" id="flipPhoto">⇄ Zrkadliť</button><button class="action secondary" id="resetPhoto">Reset</button><p class="hint">Posuvníky menia pixely fotografie aj offline. Export je JPG. RAW nie je podporovaný.</p></div></div>';document.getElementById('photoInput').onchange=e=>loadPhoto(e.target.files[0]);['bright','contrast','sat'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById(id+'Val').textContent=document.getElementById(id).value+'%';drawPhoto()});document.getElementById('keepPhoto').onclick=()=>{if(!photoImg)return alert('Najprv vyber fotku.');document.getElementById('canvas').toBlob(async blob=>{if(!blob)return;try{await galleryPut(new File([blob],'PocketOS-'+Date.now()+'.jpg',{type:'image/jpeg'}));alert('Uložené do offline galérie.')}catch(err){alert(err.message)}},'image/jpeg',.9)};document.getElementById('rotatePhoto').onclick=()=>{photoRotation=(photoRotation+90)%360;drawPhoto()};document.getElementById('flipPhoto').onclick=()=>{photoFlip=!photoFlip;drawPhoto()};document.getElementById('resetPhoto').onclick=()=>{photoRotation=0;photoFlip=false;['bright','contrast','sat'].forEach(id=>{document.getElementById(id).value=100;document.getElementById(id+'Val').textContent='100%'});drawPhoto()};document.getElementById('savePhoto').onclick=()=>{if(!photoImg)return alert('Najprv vyber fotku.');let canvas=document.getElementById('canvas');canvas.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='PocketOS-photo.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/jpeg',.9)};drawPhoto()}if(n==='Terminal'){c.innerHTML='<div class="terminal" id="term">PocketOS shell (simulácia, nie Linux)\nPríkazy: help, date, about, clear, echo, apps\n<br><span id="history"></span>&gt; <input id="cmd" autocomplete="off" spellcheck="false"></div>';document.getElementById('cmd').onkeydown=e=>{if(e.key!=='Enter')return;let cmd=e.target.value.trim(),parts=cmd.split(' ');let output=cmd==='help'?'help, date, about, clear, echo, apps':cmd==='date'?new Date().toString():cmd==='about'?'PocketOS v0.9 – offline web desktop':cmd==='apps'?'Files, Gallery, Notes, Photos, Games, Terminal, Settings':parts[0]==='echo'?parts.slice(1).join(' '):'Neznámy príkaz';let h=document.getElementById('history');h.textContent+=cmd==='clear'?'':'> '+cmd+'\n'+output+'\n';if(cmd==='clear')h.textContent='';e.target.value=''}}if(n==='Settings'){c.innerHTML='<b>PocketOS v0.9</b><p class="hint">Téma plochy</p><div class="settings-grid"><button class="swatch" onclick="theme(\'ocean\')">🌅 Ocean</button><button class="swatch" onclick="theme(\'night\')">🌙 Night</button><button class="swatch" onclick="theme(\'forest\')">🌲 Forest</button></div><p class="hint">Offline: rozhranie sa ukladá do cache prehliadača. iOS môže cache vymazať. Fotky sa nesynchronizujú a export treba uložiť do Súborov.</p><p class="hint">Klávesové skratky: Escape zavrie okno; Cmd/Control + 1–5 otvorí Files, Notes, Photos, Terminal, Settings.</p>'}}const dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('pocketos-gallery',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});async function galleryPut(file){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').add({name:file.name,blob:file,created:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function galleryAll(){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function galleryDelete(id){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function renderGallery(){const list=document.getElementById('galleryList');if(!list)return;const photos=await galleryAll();if(!document.getElementById('galleryList'))return;list.replaceChildren();for(const photo of photos.reverse()){const cell=document.createElement('div');cell.className='gallery-cell';const url=URL.createObjectURL(photo.blob);const img=document.createElement('img');img.src=url;img.onload=()=>URL.revokeObjectURL(url);const name=document.createElement('div');name.textContent=photo.name;name.className='hint';const edit=document.createElement('button');edit.className='action';edit.textContent='Upraviť';edit.onclick=()=>{openApp('Photos');loadPhoto(photo.blob)};const del=document.createElement('button');del.className='action secondary';del.textContent='Zmazať';del.onclick=async()=>{if(confirm('Naozaj zmazať túto fotku z PocketOS?')){await galleryDelete(photo.id);renderGallery()}};cell.append(img,name,edit,del);list.append(cell)}}function theme(t){document.body.dataset.theme=t;localStorage.setItem('pocketos-theme',t)}theme(localStorage.getItem('pocketos-theme')||'ocean');function loadPhoto(f){if(!f)return;photoRotation=0;photoFlip=false;if(!f.type.startsWith('image/'))return alert('Vyber JPG, PNG alebo HEIC, ak ho prehliadač podporuje.');if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);let img=new Image();img.onload=()=>{photoImg=img;drawPhoto()};img.onerror=()=>alert('Tento obrázok sa nepodarilo otvoriť.');img.src=photoURL}function drawPhoto(){const canvas=document.getElementById('canvas');if(!canvas)return;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!photoImg){canvas.width=640;canvas.height=360;ctx.fillStyle='#1c2437';ctx.fillRect(0,0,640,360);ctx.fillStyle='#dce4f6';ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillText('Vyber fotografiu',320,180);return}const scale=Math.min(1,1400/Math.max(photoImg.naturalWidth,photoImg.naturalHeight));canvas.width=Math.max(1,Math.round(photoImg.naturalWidth*scale));canvas.height=Math.max(1,Math.round(photoImg.naturalHeight*scale));const cw=canvas.width,ch=canvas.height;const rotated=photoRotation%180!==0;if(rotated){canvas.width=ch;canvas.height=cw}ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(photoRotation*Math.PI/180);ctx.scale(photoFlip?-1:1,1);ctx.drawImage(photoImg,-cw/2,-ch/2,cw,ch);ctx.restore();const brightness=Number(document.getElementById('bright').value)/100;const contrast=Number(document.getElementById('contrast').value)/100;const saturation=Number(document.getElementById('sat').value)/100;if(brightness===1&&contrast===1&&saturation===1)return;const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);const d=pixels.data;for(let i=0;i<d.length;i+=4){let r=d[i]*brightness,g=d[i+1]*brightness,b=d[i+2]*brightness;r=(r-128)*contrast+128;g=(g-128)*contrast+128;b=(b-128)*contrast+128;const lum=.2126*r+.7152*g+.0722*b;d[i]=Math.max(0,Math.min(255,lum+(r-lum)*saturation));d[i+1]=Math.max(0,Math.min(255,lum+(g-lum)*saturation));d[i+2]=Math.max(0,Math.min(255,lum+(b-lum)*saturation))}ctx.putImageData(pixels,0,0)}let gameTimer=null,gameKey=null,gameFrame=null,gameCleanup=null;
function stopGame(){if(gameFrame!==null){cancelAnimationFrame(gameFrame);gameFrame=null}if(gameCleanup){gameCleanup();gameCleanup=null}if(gameTimer){clearInterval(gameTimer);gameTimer=null}if(gameKey){removeEventListener('keydown',gameKey);gameKey=null}}
function showGames(){c.innerHTML='<b>🎮 Offline hry</b><p class="hint">Fungujú bez internetu. Vyber hru:</p><div class="games-menu"><button onclick="startMiniCorsa()">🏁 Mini Corsa 3D</button><button onclick="startRacer()">🏎️ Pocket Racer</button><button onclick="startSnake()">🐍 Snake</button><button onclick="startTicTacToe()">⭕ Piškvorky</button><button onclick="startReaction()">⚡ Reflex</button></div>'}
function gameHome(){stopGame();showGames()}
function startRacer(){
 stopGame();
 c.innerHTML='<div class="games-top"><button class="action secondary" onclick="gameHome()">← Hry</button><b>🏎️ Pocket Racer</b><span class="racer-hud" id="racerScore">0 m · 0 km/h</span><button class="action" id="racerRestart">Znova</button></div><div class="racer-wrap"><canvas class="racer-canvas" id="racerCanvas" width="300" height="400"></canvas><div class="racer-side"><button id="racerLeft" aria-label="Doľava">◀</button><button id="racerRight" aria-label="Doprava">▶</button><small>← → / A D</small></div></div>';
 const canvas=document.getElementById('racerCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('racerScore');
 const lanes=[94,150,206],roadL=62,roadR=238;
 let lane=1,traffic=[],distance=0,speed=0,elapsed=0,spawn=0,roadScroll=0,alive=true,last=performance.now(),pointerStart=null;
 const controls=[];
 function steer(delta){if(!alive)return;lane=Math.max(0,Math.min(2,lane+delta))}
 const left=document.getElementById('racerLeft'),right=document.getElementById('racerRight');
 for(const [button,d] of [[left,-1],[right,1]]){const fn=e=>{e.preventDefault();steer(d)};button.addEventListener('pointerdown',fn);controls.push(()=>button.removeEventListener('pointerdown',fn))}
 const touchStart=e=>{pointerStart=e.touches[0].clientX},touchEnd=e=>{if(pointerStart===null)return;const diff=e.changedTouches[0].clientX-pointerStart;if(Math.abs(diff)>16)steer(diff>0?1:-1);pointerStart=null};
 canvas.addEventListener('touchstart',touchStart,{passive:true});canvas.addEventListener('touchend',touchEnd,{passive:true});
 controls.push(()=>{canvas.removeEventListener('touchstart',touchStart);canvas.removeEventListener('touchend',touchEnd)});
 gameKey=e=>{if(['ArrowLeft','a','A','ArrowRight','d','D'].includes(e.key)){e.preventDefault();steer(['ArrowLeft','a','A'].includes(e.key)?-1:1)}};
 addEventListener('keydown',gameKey);
 const restart=()=>startRacer();document.getElementById('racerRestart').addEventListener('click',restart);
 controls.push(()=>{document.getElementById('racerRestart')?.removeEventListener('click',restart)});
 gameCleanup=()=>{for(const fn of controls)fn()};
 function car(x,y,color,player=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#101d27';ctx.fillRect(-17,-26,34,52);ctx.fillStyle=color;ctx.fillRect(-15,-23,30,46);ctx.fillStyle=player?'#bceaff':'#a8b9c9';ctx.fillRect(-11,-12,22,14);ctx.fillStyle='#172a38';ctx.fillRect(-11,10,22,8);ctx.fillStyle='#fce5aa';ctx.fillRect(-13,-24,7,5);ctx.fillRect(6,-24,7,5);ctx.fillStyle='#fa6565';ctx.fillRect(-13,18,6,4);ctx.fillRect(7,18,6,4);ctx.restore()}
 function render(){ctx.fillStyle='#34664e';ctx.fillRect(0,0,300,400);ctx.fillStyle='#777b81';ctx.fillRect(roadL,0,roadR-roadL,400);ctx.fillStyle='#dfe8dc';ctx.fillRect(roadL+3,0,3,400);ctx.fillRect(roadR-6,0,3,400);ctx.fillStyle='#f2eee0';for(let y=-48+(roadScroll%55);y<400;y+=55){ctx.fillRect(121,y,4,28);ctx.fillRect(177,y,4,28)}for(const carObj of traffic)car(lanes[carObj.lane],carObj.y,carObj.color);car(lanes[lane],337,'#42b7f4',true);if(!alive){ctx.fillStyle='rgba(9,19,33,.83)';ctx.fillRect(36,136,228,124);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillText('Nehoda!',150,176);ctx.font='15px sans-serif';ctx.fillText('Prešiel si '+Math.floor(distance)+' m',150,203);ctx.fillText('Klikni Znova',150,229)}}
 function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(alive){elapsed+=dt;speed=Math.min(195,75+elapsed*5);distance+=speed*dt/3.6;roadScroll+=speed*dt/2.6;spawn+=dt;const interval=Math.max(.48,1.35-elapsed*.014);if(spawn>=interval){spawn=0;const recent=traffic.filter(t=>t.y<115);const options=[0,1,2].filter(l=>!recent.some(t=>t.lane===l));if(options.length)traffic.push({lane:options[Math.floor(Math.random()*options.length)],y:-38,color:['#f7c75d','#ff797b','#a98fff'][Math.floor(Math.random()*3)]})}for(const t of traffic)t.y+=(speed*.68+45)*dt;traffic=traffic.filter(t=>t.y<450);if(traffic.some(t=>t.lane===lane&&Math.abs(t.y-337)<45)){alive=false}scoreEl.textContent=Math.floor(distance)+' m · '+(alive?Math.round(speed):0)+' km/h'}render();if(alive)gameFrame=requestAnimationFrame(loop);else gameFrame=null}
 render();gameFrame=requestAnimationFrame(loop)

function startMiniCorsa(){

 const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),size=15,cell=16;
 let snake=[{x:7,y:7},{x:6,y:7}],dir={x:1,y:0},next={...dir},food={x:10,y:7},score=0,over=false;
