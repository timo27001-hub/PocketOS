<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#121b35"><link rel="manifest" href="./manifest.webmanifest"><title>PocketOS</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;color:white;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#192746;user-select:none}body[data-theme="ocean"]{background:radial-gradient(ellipse at 80% 5%,#f8a0b0,transparent 45%),radial-gradient(ellipse at 10% 95%,#39a6d6,transparent 48%),linear-gradient(125deg,#15264a,#684d94)}body[data-theme="night"]{background:radial-gradient(ellipse at 65% 15%,#505cbb,transparent 45%),linear-gradient(120deg,#101a31,#142f4d)}body[data-theme="forest"]{background:radial-gradient(ellipse at 80% 0%,#a6c58b,transparent 45%),linear-gradient(130deg,#123b43,#236b65)}button,input,textarea{font:inherit}button{cursor:pointer}header{height:29px;padding:0 12px;display:flex;align-items:center;gap:12px;background:#07112277;backdrop-filter:blur(20px);font-weight:600}header .right{margin-left:auto}main{height:calc(100dvh - 29px);position:relative}.dock{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px 7px;border-radius:15px;background:#ffffff40;border:1px solid #ffffff55;backdrop-filter:blur(22px);box-shadow:0 7px 24px #0003}.app{height:38px;width:39px;border:0;border-radius:10px;background:#ffffffe8;font-size:22px}.app:active{transform:scale(.9)}.window{position:absolute;left:9%;top:5%;width:82%;height:77%;min-height:125px;display:none;flex-direction:column;overflow:hidden;background:#f6f7fbee;color:#1e2a43;border:1px solid #ffffffa0;border-radius:12px;box-shadow:0 14px 40px #0006}.window.active{display:flex}.titlebar{height:31px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 10px;background:#e1e5f0;touch-action:none}.close{width:12px;height:12px;background:#ff6058;border:0;border-radius:50%;padding:0}.content{padding:10px;flex:1;min-height:0;overflow:auto}.content textarea{width:100%;height:100%;resize:none;border:0;outline:none;background:transparent;color:#17233e;font-size:13px}.action{border:0;border-radius:7px;padding:6px 9px;background:#3456b6;color:white;margin:3px}.action.secondary{background:#dce3f3;color:#243450}.hint{font-size:10px;opacity:.72}.terminal{height:100%;background:#101a2c;color:#b8f4cf;border-radius:7px;padding:9px;font:11px ui-monospace,monospace;white-space:pre-wrap;overflow:auto}.terminal input{border:0;outline:0;background:transparent;color:white;font:inherit;width:72%}.preview{max-height:100px;max-width:100%;object-fit:contain}.photo-layout{display:flex;gap:10px;height:100%;min-height:0}.photo-stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#1c2437;border-radius:8px;overflow:hidden}.photo-stage canvas{max-width:100%;max-height:100%;object-fit:contain}.photo-tools{width:145px;overflow:auto}.photo-tools label{display:block;font-size:10px;margin-bottom:6px}.photo-tools input[type=range]{width:100%;display:block}.file-row{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #dce2ee}.file-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rotate{display:none}.desktop-icon{position:absolute;left:18px;top:20px;text-align:center;text-shadow:0 1px 4px #0008}.desktop-icon button{background:#ffffff25;border:1px solid #ffffff40;border-radius:12px;font-size:25px;width:47px;height:47px}.desktop-icon small{display:block;margin-top:3px}.status{font-size:10px}.settings-grid{display:flex;gap:6px;flex-wrap:wrap}.swatch{padding:9px;border:1px solid #cbd3e4;border-radius:7px;background:#e5eafa;color:#17233e}@media(orientation:portrait){.rotate{display:flex;position:fixed;inset:0;z-index:99;background:#121c33;align-items:center;justify-content:center;text-align:center;font-size:19px;padding:24px}header,main{visibility:hidden}}@media(max-height:300px){.window{top:2%;height:77%}.app{width:34px;height:34px;font-size:19px}.dock{padding:3px}.photo-tools{width:125px}}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:9px}.gallery-cell{background:#e4eaf5;border-radius:8px;padding:7px;overflow:hidden}.gallery-cell img{width:100%;height:85px;object-fit:cover;border-radius:5px}.gallery-cell .action{font-size:10px;padding:5px;margin:3px 2px}@media(max-height:300px){.gallery-cell img{height:55px}}</style></head><body data-theme="ocean"><div class="rotate">↻ Otoč iPhone na šírku a vypni zámok otáčania.</div><header><span>◆ PocketOS</span><span id="appname">Desktop</span><span class="right status" id="net">Offline ready</span><span id="clock"></span></header><main><div class="desktop-icon"><button onclick="openApp('Files')">📁</button><small>Files</small></div><section class="window" id="window"><div class="titlebar" id="drag"><button class="close" onclick="closeWin()" aria-label="Zavrieť"></button><b id="winTitle">Files</b><span style="margin-left:auto;font-size:10px">PocketOS 0.4</span></div><div class="content" id="content"></div></section><nav class="dock"><button class="app" title="Files" onclick="openApp('Files')">📁</button><button class="app" title="Gallery" onclick="openApp('Gallery')">🗂️</button><button class="app" title="Notes" onclick="openApp('Notes')">📝</button><button class="app" title="Photos" onclick="openApp('Photos')">🖼️</button><button class="app" title="Terminal" onclick="openApp('Terminal')">⌨️</button><button class="app" title="Settings" onclick="openApp('Settings')">⚙️</button></nav></main><script>
const w=document.getElementById('window'),c=document.getElementById('content');let photoURL=null,photoImg=null;function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);function net(){document.getElementById('net').textContent=navigator.onLine?'● Online':'● Offline'}addEventListener('online',net);addEventListener('offline',net);net();function closeWin(){w.classList.remove('active');document.getElementById('appname').textContent='Desktop'}function openApp(n){document.getElementById('winTitle').textContent=n;document.getElementById('appname').textContent=n;w.classList.add('active');w.style.left='9%';w.style.top='5%';if(n==='Notes'){c.innerHTML='<textarea id="notes" placeholder="Tvoje poznámky sa ukladajú do tohto iPhonu..."></textarea>';let x=document.getElementById('notes');x.value=localStorage.getItem('pocketos-notes')||'';x.oninput=()=>localStorage.setItem('pocketos-notes',x.value)}if(n==='Files'){c.innerHTML='<b>Moje súbory</b><p class="hint">Vyber súbor z aplikácie Súbory. PocketOS nemá automatický prístup ku všetkým súborom iOS.</p><input id="fileInput" type="file" multiple><div id="fileList"></div>';document.getElementById('fileInput').onchange=e=>{let list=document.getElementById('fileList');list.replaceChildren();for(const f of e.target.files){let row=document.createElement('div');row.className='file-row';let name=document.createElement('span');name.textContent='📄 '+f.name+' ('+Math.round(f.size/1024)+' KB)';let b=document.createElement('button');b.className='action secondary';b.textContent='Otvoriť';b.onclick=()=>{if(f.type.startsWith('image/')){openApp('Photos');loadPhoto(f)}else if(f.type.startsWith('text/')){f.text().then(t=>{openApp('Notes');document.getElementById('notes').value=t})}else alert('Tento typ súboru PocketOS zatiaľ nevie zobraziť.')};row.append(name,b);list.append(row)}}}if(n==='Gallery'){c.innerHTML='<b>Offline galéria</b><p class="hint">Fotky sa ukladajú iba do tohto iPhonu. iOS ich môže pri nedostatku miesta odstrániť – dôležité fotky si zálohuj.</p><input type="file" id="galleryInput" accept="image/*" multiple><div id="galleryList" class="gallery-grid"></div>';document.getElementById('galleryInput').onchange=async e=>{for(const file of e.target.files){try{await galleryPut(file)}catch(err){alert('Fotku sa nepodarilo uložiť: '+err.message)}}renderGallery()};renderGallery()}if(n==='Photos'){c.innerHTML='<div class="photo-layout"><div class="photo-stage"><canvas id="canvas" width="640" height="360"></canvas></div><div class="photo-tools"><label><b>Photo Editor</b></label><input type="file" id="photoInput" accept="image/*"><label>Jas <output id="brightVal">100%</output><input id="bright" type="range" min="0" max="200" value="100"></label><label>Kontrast <output id="contrastVal">100%</output><input id="contrast" type="range" min="0" max="200" value="100"></label><label>Sýtosť <output id="satVal">100%</output><input id="sat" type="range" min="0" max="200" value="100"></label><button class="action" id="savePhoto">Export JPG</button><button class="action secondary" id="keepPhoto">Uložiť do galérie</button><button class="action secondary" id="resetPhoto">Reset</button><p class="hint">Posuvníky menia pixely fotografie aj offline. Export je JPG. RAW nie je podporovaný.</p></div></div>';document.getElementById('photoInput').onchange=e=>loadPhoto(e.target.files[0]);['bright','contrast','sat'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById(id+'Val').textContent=document.getElementById(id).value+'%';drawPhoto()});document.getElementById('keepPhoto').onclick=()=>{if(!photoImg)return alert('Najprv vyber fotku.');document.getElementById('canvas').toBlob(async blob=>{if(!blob)return;try{await galleryPut(new File([blob],'PocketOS-'+Date.now()+'.jpg',{type:'image/jpeg'}));alert('Uložené do offline galérie.')}catch(err){alert(err.message)}},'image/jpeg',.9)};document.getElementById('resetPhoto').onclick=()=>{['bright','contrast','sat'].forEach(id=>{document.getElementById(id).value=100;document.getElementById(id+'Val').textContent='100%'});drawPhoto()};document.getElementById('savePhoto').onclick=()=>{if(!photoImg)return alert('Najprv vyber fotku.');let canvas=document.getElementById('canvas');canvas.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='PocketOS-photo.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/jpeg',.9)};drawPhoto()}if(n==='Terminal'){c.innerHTML='<div class="terminal" id="term">PocketOS shell (simulácia, nie Linux)\nPríkazy: help, date, about, clear, echo, apps\n<br><span id="history"></span>&gt; <input id="cmd" autocomplete="off" spellcheck="false"></div>';document.getElementById('cmd').onkeydown=e=>{if(e.key!=='Enter')return;let cmd=e.target.value.trim(),parts=cmd.split(' ');let output=cmd==='help'?'help, date, about, clear, echo, apps':cmd==='date'?new Date().toString():cmd==='about'?'PocketOS v0.4 – offline web desktop':cmd==='apps'?'Files, Gallery, Notes, Photos, Terminal, Settings':parts[0]==='echo'?parts.slice(1).join(' '):'Neznámy príkaz';let h=document.getElementById('history');h.textContent+=cmd==='clear'?'':'> '+cmd+'\n'+output+'\n';if(cmd==='clear')h.textContent='';e.target.value=''}}if(n==='Settings'){c.innerHTML='<b>PocketOS v0.4</b><p class="hint">Téma plochy</p><div class="settings-grid"><button class="swatch" onclick="theme(\'ocean\')">🌅 Ocean</button><button class="swatch" onclick="theme(\'night\')">🌙 Night</button><button class="swatch" onclick="theme(\'forest\')">🌲 Forest</button></div><p class="hint">Offline: rozhranie sa ukladá do cache prehliadača. iOS môže cache vymazať. Fotky sa nesynchronizujú a export treba uložiť do Súborov.</p><p class="hint">Klávesové skratky: Escape zavrie okno; Cmd/Control + 1–5 otvorí aplikácie.</p>'}}const dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('pocketos-gallery',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});async function galleryPut(file){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').add({name:file.name,blob:file,created:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function galleryAll(){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function galleryDelete(id){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function renderGallery(){const list=document.getElementById('galleryList');if(!list)return;const photos=await galleryAll();if(!document.getElementById('galleryList'))return;list.replaceChildren();for(const photo of photos.reverse()){const cell=document.createElement('div');cell.className='gallery-cell';const url=URL.createObjectURL(photo.blob);const img=document.createElement('img');img.src=url;img.onload=()=>URL.revokeObjectURL(url);const name=document.createElement('div');name.textContent=photo.name;name.className='hint';const edit=document.createElement('button');edit.className='action';edit.textContent='Upraviť';edit.onclick=()=>{openApp('Photos');loadPhoto(photo.blob)};const del=document.createElement('button');del.className='action secondary';del.textContent='Zmazať';del.onclick=async()=>{if(confirm('Naozaj zmazať túto fotku z PocketOS?')){await galleryDelete(photo.id);renderGallery()}};cell.append(img,name,edit,del);list.append(cell)}}function theme(t){document.body.dataset.theme=t;localStorage.setItem('pocketos-theme',t)}theme(localStorage.getItem('pocketos-theme')||'ocean');function loadPhoto(f){if(!f)return;if(!f.type.startsWith('image/'))return alert('Vyber JPG, PNG alebo HEIC, ak ho prehliadač podporuje.');if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);let img=new Image();img.onload=()=>{photoImg=img;drawPhoto()};img.onerror=()=>alert('Tento obrázok sa nepodarilo otvoriť.');img.src=photoURL}function drawPhoto(){const canvas=document.getElementById('canvas');if(!canvas)return;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!photoImg){canvas.width=640;canvas.height=360;ctx.fillStyle='#1c2437';ctx.fillRect(0,0,640,360);ctx.fillStyle='#dce4f6';ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillText('Vyber fotografiu',320,180);return}const scale=Math.min(1,1400/Math.max(photoImg.naturalWidth,photoImg.naturalHeight));canvas.width=Math.max(1,Math.round(photoImg.naturalWidth*scale));canvas.height=Math.max(1,Math.round(photoImg.naturalHeight*scale));ctx.drawImage(photoImg,0,0,canvas.width,canvas.height);const brightness=Number(document.getElementById('bright').value)/100;const contrast=Number(document.getElementById('contrast').value)/100;const saturation=Number(document.getElementById('sat').value)/100;if(brightness===1&&contrast===1&&saturation===1)return;const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);const d=pixels.data;for(let i=0;i<d.length;i+=4){let r=d[i]*brightness,g=d[i+1]*brightness,b=d[i+2]*brightness;r=(r-128)*contrast+128;g=(g-128)*contrast+128;b=(b-128)*contrast+128;const lum=.2126*r+.7152*g+.0722*b;d[i]=Math.max(0,Math.min(255,lum+(r-lum)*saturation));d[i+1]=Math.max(0,Math.min(255,lum+(g-lum)*saturation));d[i+2]=Math.max(0,Math.min(255,lum+(b-lum)*saturation))}ctx.putImageData(pixels,0,0)}let dragging=false,dx=0,dy=0;const drag=document.getElementById('drag');drag.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragging=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;drag.setPointerCapture(e.pointerId)});drag.addEventListener('pointermove',e=>{if(!dragging)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-dx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-29-w.offsetHeight,e.clientY-dy-29))+'px'});drag.addEventListener('pointerup',()=>dragging=false);addEventListener('keydown',e=>{if(e.key==='Escape')closeWin();if((e.metaKey||e.ctrlKey)&&/^[1-5]$/.test(e.key)){e.preventDefault();openApp(['Files','Notes','Photos','Terminal','Settings'][Number(e.key)-1])}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
