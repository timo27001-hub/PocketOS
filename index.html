<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101b36"><link rel="manifest" href="manifest.webmanifest"><title>PocketOS</title><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;background:radial-gradient(ellipse at 75% 10%,#e98eaa 0%,transparent 36%),radial-gradient(ellipse at 20% 80%,#3e8fe1 0%,transparent 45%),linear-gradient(135deg,#19284b,#643c87);height:100dvh;overflow:hidden;user-select:none}button{font:inherit;cursor:pointer}.bar{height:29px;display:flex;align-items:center;gap:13px;padding:0 12px;background:#07152d7a;backdrop-filter:blur(22px);font-weight:600}.bar .right{margin-left:auto}.desktop{height:calc(100dvh - 29px);position:relative}.dock{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:7px;background:#f5f5ff44;border:1px solid #ffffff55;backdrop-filter:blur(22px);border-radius:15px;padding:6px}.app{width:43px;height:43px;border:0;border-radius:11px;background:#ffffffd9;font-size:23px;box-shadow:0 2px 8px #0003}.window{position:absolute;top:10%;left:12%;width:76%;height:72%;background:#f3f4faed;color:#18233d;border-radius:11px;box-shadow:0 15px 50px #0006;overflow:hidden;display:none;flex-direction:column;min-width:220px;min-height:120px}.window.active{display:flex}.titlebar{height:32px;flex-shrink:0;background:#dce2ee;display:flex;align-items:center;gap:8px;padding:0 10px;touch-action:none}.close{border:0;border-radius:50%;background:#ff5f57;width:12px;height:12px;padding:0}.content{padding:13px;overflow:auto;flex:1}.content textarea{width:100%;height:95%;resize:none;border:0;background:transparent;color:#18233d;outline:0;font:14px -apple-system,sans-serif}.terminal{background:#101729;color:#c7f7d6;font:12px monospace;height:100%;padding:12px;white-space:pre-wrap}.terminal input{background:none;color:#fff;border:0;outline:none;font:inherit;width:75%}.file{background:#fff;border-radius:8px;padding:10px;margin:6px 0;color:#243b5c}.hint{opacity:.7;font-size:11px}.small{font-size:11px}.settings button{margin-top:8px}.rotate{display:none}@media(orientation:portrait){.rotate{display:flex;position:fixed;inset:0;z-index:999;background:#131e38;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}.desktop,.bar{visibility:hidden}}@media(max-height:300px){.app{width:36px;height:36px;font-size:20px}.dock{padding:4px}.window{height:76%;top:4%}}
</style></head><body><div class="rotate">↻<br>Otoč iPhone na šírku</div><div class="bar"><span>◆ PocketOS</span><span id="appname">Desktop</span><span class="right" id="clock"></span><span>◉</span></div><main class="desktop"><div class="window" id="window"><div class="titlebar" id="drag"><button class="close" onclick="closeWin()" aria-label="Zavrieť"></button><strong id="winTitle">Files</strong></div><div class="content" id="winContent"></div></div><nav class="dock" aria-label="Aplikácie"><button class="app" onclick="openApp('Files')" title="Files">📁</button><button class="app" onclick="openApp('Notes')" title="Notes">📝</button><button class="app" onclick="openApp('Terminal')" title="Terminal">⌨️</button><button class="app" onclick="openApp('Photos')" title="Photos">🖼️</button><button class="app" onclick="openApp('Settings')" title="Settings">⚙️</button></nav></main><script>
const w=document.getElementById('window'),content=document.getElementById('winContent');function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);function closeWin(){w.classList.remove('active');document.getElementById('appname').textContent='Desktop'}function openApp(name){document.getElementById('winTitle').textContent=name;document.getElementById('appname').textContent=name;w.classList.add('active');w.style.left='12%';w.style.top='10%';let html='';if(name==='Files')html='<b>Moje súbory</b><p class="hint">Webová aplikácia nemá voľný prístup ku všetkým súborom iPhonu.</p><label class="file">📂 Otvoriť súbor <input type="file" id="filepick" style="max-width:180px"></label><div id="filename"></div>';if(name==='Notes')html='<textarea id="notes" placeholder="Napíš si poznámky..." aria-label="Poznámky"></textarea>';if(name==='Terminal')html='<div class="terminal">PocketOS Terminal (demo)\nPríkazy: help, date, clear, about\n<br><span id="history"></span>&gt; <input id="cmd" autocomplete="off" spellcheck="false"></div>';if(name==='Photos')html='<b>Fotky</b><p class="hint">Vyber fotografiu z iPhonu. Spracovanie prebieha lokálne.</p><input type="file" accept="image/*" id="photo"><div style="margin-top:8px"><img id="preview" style="max-width:100%;max-height:130px"></div>';if(name==='Settings')html='<div class="settings"><b>PocketOS 0.1</b><p>Offline mini desktop pre iPhone 12 mini.</p><p class="small">Toto je webové prostredie, nie macOS. Na offline používanie musí byť nainštalované z HTTPS a uložené do cache.</p><button onclick="alert(\'PocketOS v0.1\')">O systéme</button></div>';content.innerHTML=html;if(name==='Notes'){let n=document.getElementById('notes');n.value=localStorage.getItem('pocketnotes')||'';n.oninput=()=>localStorage.setItem('pocketnotes',n.value)}if(name==='Files')document.getElementById('filepick').onchange=e=>document.getElementById('filename').textContent=e.target.files[0]?.name||'';if(name==='Photos')document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(f){const u=URL.createObjectURL(f);document.getElementById('preview').src=u}};if(name==='Terminal'){let c=document.getElementById('cmd'),h=document.getElementById('history');c.onkeydown=e=>{if(e.key==='Enter'){let s=c.value.trim(),out=({help:'help, date, clear, about',about:'PocketOS 0.1 – demo terminal'})[s]??(s==='date'?new Date().toString():'Neznámy príkaz');if(s==='clear')h.textContent='';else h.textContent+='> '+s+'\n'+out+'\n';c.value=''}}}}
let dragging=false,dx=0,dy=0;const drag=document.getElementById('drag');drag.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragging=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;drag.setPointerCapture(e.pointerId)});drag.addEventListener('pointermove',e=>{if(!dragging)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-dx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-30-w.offsetHeight,e.clientY-dy-29))+'px'});drag.addEventListener('pointerup',()=>dragging=false);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
